<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Pilates">
<meta name="theme-color" content="#f5f4f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi Pilates</title><style>
:root{--bg:#f5f4f0;--fg:#1d2a25;--mu:#5d6d66;--ac:#2f8a67;--ink:#ffffff;--sf:#ffffff;--sf2:#e4ece8;--tr:#dde5e1;--ds:#2f6b57;--cf:#44524c;--ib:#e8ebe8;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12211c;--fg:#f2f1ec;--mu:#8fa79c;--ac:#4fb28c;--ink:#0c1a15;--sf:#1a2c26;--sf2:#22392f;--tr:#22392f;--ds:#7ed3ad;--cf:#b9cdc4;--ib:#1c2f28}}
:root[data-theme="dark"]{--bg:#12211c;--fg:#f2f1ec;--mu:#8fa79c;--ac:#4fb28c;--ink:#0c1a15;--sf:#1a2c26;--sf2:#22392f;--tr:#22392f;--ds:#7ed3ad;--cf:#b9cdc4;--ib:#1c2f28}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
#app{width:100%;max-width:480px;padding:16px 16px 26px;display:flex;flex-direction:column;min-height:100%}
.scr{display:none;flex:1;flex-direction:column}.scr.on{display:flex}
h1{font-size:32px;font-weight:600;line-height:1.1;margin:8px 0 4px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin-bottom:8px}
.track{height:4px;background:var(--tr);border-radius:2px;overflow:hidden;margin-bottom:10px}
.fill{height:100%;background:var(--ac);width:0;transition:width .3s}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav .pos{flex:1;text-align:center;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.nav button{width:auto;flex:0 0 auto;padding:10px 14px;font-size:15px;background:var(--sf2);color:var(--fg)}
.nav button:disabled{opacity:.35}
.phase{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:4px}
h2{font-size:25px;font-weight:600;line-height:1.15}
.set{font-size:15px;color:var(--mu);margin-top:3px}
.dose{font-size:20px;font-weight:600;color:var(--ds);margin-top:8px}
img{width:100%;max-width:100%;border-radius:14px;margin:12px 0;display:block;background:var(--ib)}
.cue{font-size:14px;line-height:1.45;color:var(--cf);background:var(--sf);border-radius:12px;padding:12px 14px}
.spacer{flex:1;min-height:10px}
button{width:100%;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation}
.go{background:var(--ac);color:var(--ink);margin-top:12px}
.row{display:flex;gap:10px;margin-top:10px}.row button{flex:1}
.alt{background:var(--sf2);color:var(--fg);padding:13px;font-size:15px}
.link{background:none;color:var(--mu);font-size:14px;font-weight:500;padding:6px 0;width:auto}
.pick{background:var(--sf);color:var(--fg);text-align:left;padding:18px 18px;margin-top:12px;border-left:5px solid var(--ac)}
.pick b{display:block;font-size:21px}.pick span{display:block;font-size:14px;font-weight:400;color:var(--mu);margin-top:3px}
.count{font-size:74px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.05;text-align:center;margin:6px 0}
.rlab{font-size:13px;font-weight:600;color:var(--mu);text-align:center}
.next{font-size:15px;color:var(--cf);text-align:center;margin-top:4px}
#rest{display:none;flex-direction:column;flex:1}
#work{display:flex;flex-direction:column;flex:1}
.big{font-size:50px;font-weight:300;font-variant-numeric:tabular-nums;margin:8px 0}
.hide{display:none!important}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ac);opacity:0;pointer-events:none;transition:opacity .18s}
</style></head><body><div id="flash"></div><div id="app">

<div id="home" class="scr on">
<h1>Mi Pilates</h1>
<div class="set">Elige la rutina de hoy.</div>
<button class="pick" data-r="g"><b>Glúteos</b><span>6 ejercicios, unos 38 minutos</span></button>
<button class="pick" data-r="c"><b>Glúteos corta</b><span>6 ejercicios, unos 20 minutos</span></button>
<button class="pick" data-r="a"><b>Abdomen</b><span>5 ejercicios, unos 12 minutos</span></button>
<div class="spacer"></div>
<div class="cue">Sube el volumen y toca <b>Probar sonido</b>. Si el teléfono está en silencio, el iPhone no deja sonar la app.</div>
<button class="alt" id="test" style="margin-top:12px">Probar sonido</button>
</div>

<div id="start" class="scr">
<div class="bar"><button class="link" id="back0">‹ Rutinas</button><span></span></div>
<div class="phase" id="sph"></div><h2 id="snm"></h2>
<div class="set">Los descansos corren solos. Si te equivocas, usa Anterior y Siguiente arriba.</div>
<div class="cue" id="sint" style="margin-top:16px"></div>
<div class="spacer"></div><button class="go" id="begin">Empezar</button>
</div>

<div id="main" class="scr">
<div class="bar"><button class="link" id="quit">Salir</button><span id="clock">0:00</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="nav"><button id="prev">‹ Anterior</button><span class="pos" id="pos"></span><button id="nextb">Siguiente ›</button></div>

<div id="work">
<div class="phase" id="ph"></div><h2 id="nm"></h2><div class="set" id="st"></div>
<div class="dose" id="ds"></div><img id="im" alt="">
<div id="wt" class="hide"><div class="count" id="wc">30</div></div>
<div class="cue" id="cu"></div><div class="spacer"></div>
<button class="go" id="doneset">Serie lista</button>
</div>

<div id="rest">
<div class="spacer"></div>
<div class="rlab" id="rlab">Descanso</div><div class="count" id="rc">60</div>
<img id="rim" alt=""><div class="next" id="nx"></div>
<div class="spacer"></div>
<div class="row"><button class="alt" id="plus">+15 s</button><button class="alt" id="skip">Saltar descanso</button></div>
</div>
</div>

<div id="done" class="scr" style="text-align:center;justify-content:center">
<div class="phase">Terminaste</div><div class="big" id="total">0:00</div>
<div class="set" id="dnote"></div><div class="spacer"></div>
<button class="go" id="again">Repetir</button><button class="alt" id="home2" style="margin-top:10px">Volver a rutinas</button>
</div>
